<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Captured Gallery</title>
    <link rel="stylesheet" href="gallery.css" />
  </head>
  <body>
    <header>
      <h1>Captured Gallery</h1>
      <div class="actions">
        <button id="toggleSelect" type="button">Select Items</button>
        <button id="selectAll" type="button" hidden>Select All</button>
        <button id="deleteSelected" type="button" class="danger" hidden disabled>Delete Selected</button>
        <button id="importJson" type="button">Import JSON</button>
        <button id="exportJson" type="button">Export JSON</button>
        <button id="clearAll" type="button" class="danger">Clear All</button>
      </div>
    </header>

    <main>
      <p id="emptyState" class="empty">No captures yet. Use the hotkey on any page to create one.</p>
      <section id="grid" class="grid"></section>
    </main>

    <section id="viewerModal" class="viewer" hidden>
      <div class="viewer-dialog">
        <button id="viewerClose" type="button" class="viewer-close" aria-label="Close viewer">✕</button>

        <div class="viewer-content">
          <button id="viewerPrev" type="button" class="viewer-nav" aria-label="Previous image">◀</button>

          <figure class="viewer-figure">
            <img id="viewerImage" src="" alt="Captured image preview" />
          </figure>

          <button id="viewerNext" type="button" class="viewer-nav" aria-label="Next image">▶</button>
        </div>

        <div class="viewer-meta">
          <p><strong>Title:</strong> <span id="viewerTitle"></span></p>
          <p><strong>URL:</strong> <a id="viewerUrl" href="#" target="_blank" rel="noreferrer"></a></p>
          <p><strong>Date:</strong> <span id="viewerDate"></span></p>
          <div id="viewerTags" class="meta-tags"></div>
        </div>
      </div>
    </section>

    <input id="importFile" type="file" accept="application/json,.json" hidden />

    <script src="gallery.js"></script>
  </body>
</html>
